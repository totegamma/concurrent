name: Test

on:
  push:
    branches:
      - "master"
      - "develop"
  pull_request:
    branches: 
      - "master"
      - "develop"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
    - name: setup go
      uses: actions/setup-go@v2
      with:
        go-version: '1.22.5'
      id: go

    - name: Check out code
      uses: actions/checkout@v2

    - name: Go Generate
      run: go generate ./...

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out $(go list ./x/... | grep -v mock)

    - name: Assert no-containers running
      run: |
        if [ "$(docker ps -q)" ]; then
          echo "There are running containers"
          docker ps -a
          exit 1
        fi

