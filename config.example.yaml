# this is example. you must replace ccid and keys before deploy.
concrnt:
  # fqdn is instance ID
  # It is really hard and not recommended to change this value after node started
  fqdn: example.com
  # 'open' or 'invite' or 'close'
  registration: open
  # server agent account
  # it is handy to generate these info with concurrent.world devtool
  layer: concrnt-mainnet
  debug: false
  # internal (operational) listener: serves /health, /ready and the
  # replica-to-replica coordination API. point liveness/readiness probes
  # here. do NOT expose this port outside the cluster (default: 8001)
  # internalPort: 8001
  # cluster enables running multiple replicas (e.g. on kubernetes).
  # leave it out for a single instance / docker compose.
  # cluster:
  #   # endpoint of a leader-election / peer-discovery service implementing
  #   # GET /status -> {"isLeader": bool, "leaderUrl": string, "peers": [string]}.
  #   # on kubernetes, run the bundled k8s-elector binary as a sidecar (it
  #   # elects a leader via a coordination.k8s.io Lease and discovers peers
  #   # via a headless service). other backends can implement the same
  #   # protocol. empty = standalone (this instance is the only replica).
  #   electorEndpoint: "http://127.0.0.1:8002"

backends:
  postgresDsn: "host=db user=postgres password=postgres dbname=postgres port=5432 sslmode=disable"
  gatewayAddr: http://concrnt:8000
  redisAddr: "redis:6379"
  memcachedAddr: "memcached:11211"

observability:
  enableTrace: true
  traceEndpoint: "tempo:4318"

integrations:
  captchaSiteKey: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
  captchaSecret: "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
  vapidPublicKey: "BAdcVHrt3owKlClm4Rk-wxd_l-jZ7oqpGXsKVgP9l2Y6dF6zah48wPGHZ9vXeo78otErsKMha2DMiBTuzM0mDTQ"
  vapidPrivateKey: "gK0wdxV-cRr3HMWtnuKle9rCxbeSWfVv2X0YyvvlFcc"

meta:
  nickname: concurrent-domain
  description: domain description
  logo: 'https://concurrent.world/concurrent.png'
  wordmark: ''
  themeColor: '#20193b'
  maintainerName: notset
  maintainerEmail: notset@example.com

services:
  - name: world.concrnt.web
    host: web
    port: 80
    path: /
    preservePath: true

